name: mcp-assert

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  assert:
    uses: wyre-technology/.github/.github/workflows/mcp-assert.yml@7542c27000cf8d213c4910b4f397637b105a718b  # main
    with:
      entry: dist/index.js
      # Canary must be a credentials-requiring tool: the harness calls it with no
      # creds and asserts isError=true. foundu_status is deliberately creds-optional
      # (reports hasCredentials:false and succeeds), so it can't be the canary.
      # foundu_roster_summary returns isError code not_configured without creds.
      canary-tool: foundu_roster_summary
