title = "foundu-mcp gitleaks config"

[extend]
useDefault = true

# Exact fake values used by the test suite (src/__tests__/helpers.ts), the
# stdio smoke script, and evals/. Each entry is anchored to the full value;
# do not widen these to patterns or paths.
[[allowlists]]
description = "Exact test fixtures"
regexTarget = "secret"
regexes = [
  '''^foundu-test-access-token-not-real-1234567890$''',
  '''^foundu-env-token-must-not-be-used-0000$''',
  '''^foundu-test-access-token-b-not-real-0987654321$''',
  '''^foundu-eval-token-not-real-0000$''',
  '''^test-s2s-7Hq2Lw9Zr4Kx8Mv3Nb6Pc1Td5Fg0Yj$''',
  # JWT_LIKE in redact.test.ts and client.test.ts; the signature decodes to "signature-not-real-123456".
  '''^eyJhbGciOiJSUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.c2lnbmF0dXJlLW5vdC1yZWFsLTEyMzQ1Ng$''',
]
