services:
  # Gateway mode. A short-lived foundU access token arrives per request on
  # X-FoundU-Access-Token. This service sets no FOUNDU_ACCESS_TOKEN and loads
  # no env_file, so a project .env cannot inject a static vendor token.
  # Compose interpolates CONDUIT_S2S_SECRET from the shell.
  foundu-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - FOUNDU_TOOL_TIERS=read
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      # - MCP_ALLOWED_HOSTS=localhost,127.0.0.1
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
