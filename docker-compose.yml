services:
  foundu-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - FOUNDU_BASE_URL=${FOUNDU_BASE_URL}
      - FOUNDU_API_TOKEN=${FOUNDU_API_TOKEN}
      - MCP_TRANSPORT=http
      - NODE_ENV=development
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
