# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - founduBaseUrl
      - founduApiToken
    properties:
      founduBaseUrl:
        type: string
        description: Australian FoundU tenant origin (https://<tenant>.foundu.com.au)
      founduApiToken:
        type: string
        description: FoundU partner API token. Steadfast owns rotation. Infinity Ben must grant access.
  commandFunction: |-
    (config) => ({ command: 'node', args: ['dist/index.js'], env: { FOUNDU_BASE_URL: config.founduBaseUrl, FOUNDU_API_TOKEN: config.founduApiToken, MCP_TRANSPORT: 'stdio' } })
