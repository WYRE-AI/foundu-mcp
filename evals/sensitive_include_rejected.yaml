name: an HR-details include is refused before any upstream call
server:
  command: node
  args: [dist/index.js]
  env:
    FOUNDU_ACCESS_TOKEN: foundu-eval-token-not-real-0000
assert:
  tool: foundu_employees_search
  args:
    include: ["hr-details"]
  expect:
    is_error: true
    contains: ["must be one of"]
timeout: 30s
