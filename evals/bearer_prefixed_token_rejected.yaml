name: a token with its own Bearer prefix returns is_error in stdio without calling out
server:
  command: node
  args: [dist/index.js]
  env:
    FOUNDU_ACCESS_TOKEN: "Bearer foundu-eval-token-not-real-0000"
assert:
  tool: foundu_states_list
  args: {}
  expect:
    is_error: true
    contains: ["without the \"Bearer \" prefix"]
timeout: 30s
